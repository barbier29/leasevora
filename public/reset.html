<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Leasevora</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background:#f4f6f9; color:#1a202c; min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08);
          max-width:400px; width:100%; padding:28px 24px; }
  .brand { font-size:13px; font-weight:700; letter-spacing:.08em; color:#64748b;
           text-transform:uppercase; margin-bottom:18px; }
  h1 { font-size:19px; margin-bottom:6px; }
  .sub { font-size:14px; color:#64748b; margin-bottom:20px; }
  label { font-size:12.5px; color:#475569; font-weight:600; display:block; margin:14px 0 5px; }
  input { width:100%; border:1.5px solid #e2e8f0; border-radius:10px; padding:12px;
          font-size:16px; font-family:inherit; }
  button { width:100%; border:none; border-radius:12px; padding:14px; font-size:16px;
           font-weight:700; cursor:pointer; background:#2563eb; color:#fff; margin-top:20px; }
  button:disabled { opacity:.6; }
  .msg { margin-top:16px; padding:13px; border-radius:10px; font-size:14.5px; display:none; text-align:center; }
  .msg.err { background:#fef2f2; color:#b91c1c; display:block; }
  .msg.ok  { background:#f0fdf4; color:#15803d; display:block; font-weight:600; }
  a.login { display:none; text-align:center; margin-top:14px; color:#2563eb; font-weight:600;
            text-decoration:none; font-size:15px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">Leasevora</div>
  <h1>Choisissez un nouveau mot de passe</h1>
  <p class="sub">6 caractères minimum. Prenez le temps de le noter quelque part de sûr.</p>
  <form id="f">
    <label>Nouveau mot de passe</label>
    <input type="password" id="p1" autocomplete="new-password" autofocus />
    <label>Confirmez-le</label>
    <input type="password" id="p2" autocomplete="new-password" />
    <button type="submit" id="btn">Enregistrer le nouveau mot de passe</button>
  </form>
  <div class="msg" id="msg"></div>
  <a class="login" id="golog" href="/">→ Se connecter</a>
</div>
<script>
(function () {
  const token = location.pathname.split('/').pop();
  const $ = id => document.getElementById(id);
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = $('p1').value, p2 = $('p2').value, msg = $('msg');
    msg.className = 'msg';
    if (p1.length < 6) { msg.textContent = '6 caractères minimum.'; msg.className = 'msg err'; return; }
    if (p1 !== p2) { msg.textContent = 'Les deux saisies ne correspondent pas.'; msg.className = 'msg err'; return; }
    $('btn').disabled = true;
    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: p1 })
      });
      const d = await r.json();
      if (!r.ok) { msg.textContent = d.error || 'Erreur'; msg.className = 'msg err'; $('btn').disabled = false; return; }
      msg.textContent = '✓ Mot de passe enregistré !';
      msg.className = 'msg ok';
      document.getElementById('f').style.display = 'none';
      $('golog').style.display = 'block';
    } catch { msg.textContent = 'Erreur réseau'; msg.className = 'msg err'; $('btn').disabled = false; }
  });
})();
</script>
</body>
</html>
